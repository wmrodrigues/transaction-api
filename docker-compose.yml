services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: ["/bin/db-migrate", "up"]
    environment:
      POSTGRES_ADDRESS: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_db
      JWT_SECRET: rwHlpl4NwDda8DdjXhbVZ+St3vKW0inPvxil38LHen1piS5Mo48BjpMcjst6mWmu
      SERVER_ADDR: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_ADDRESS: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_db
      JWT_SECRET: rwHlpl4NwDda8DdjXhbVZ+St3vKW0inPvxil38LHen1piS5Mo48BjpMcjst6mWmu
      SERVER_ADDR: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
